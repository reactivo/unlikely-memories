<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Unlikely Memories</title>
<!-- The icons load with the page: a mask-image file is only fetched when its element is first drawn, and on phones the
     directions panel is a closed popover until opened. `crossorigin` is needed (mask images are fetched in CORS mode;
     without it the preload isn't reused and the file is fetched twice). Add a line here for every file in img/icons/. -->
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-music.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-menu.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-north.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-south.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-east.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-west.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-map.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-in.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-out.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-up.svg" crossorigin>
<link rel="preload" as="image" type="image/svg+xml" href="img/icons/icon-down.svg" crossorigin>
<!-- Styles: tokens first (it declares the layer order), then base, typography, layout and utilities, then one file per
     interface piece. The text styles are the .text-* classes (css/typography.css). See ARCHITECTURE.md §7 "Styles". -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/utilities.css">
<link rel="stylesheet" href="ui/titlebar.css">
<link rel="stylesheet" href="ui/scene.css">
<link rel="stylesheet" href="ui/log.css">
<link rel="stylesheet" href="ui/prompt.css">
<link rel="stylesheet" href="ui/compass.css">
<link rel="stylesheet" href="ui/inventory.css">
<link rel="stylesheet" href="ui/tools.css">
<link rel="stylesheet" href="ui/tabs.css">
<link rel="stylesheet" href="ui/options.css">
<link rel="stylesheet" href="ui/map.css">
<link rel="stylesheet" href="ui/home.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<!-- The landing page: the list of games, the other view of this page (css/layout.css shows one at a time; ui/home.js fills it in).
     The header is the logo (img/logo-unlikely-memories.svg: the title with its pixel-art vine above and below). -->
<main class="home text-ui" id="home" aria-labelledby="home-title">
  <!-- The bar at the top: the version left, the language switch right, as wide as the cards' column. -->
  <div class="bar">
    <p class="version text-label" id="home-version"></p>
    <div class="lang text-label" role="group"><button type="button" data-lang="en">EN</button><span aria-hidden="true">·</span><button type="button" data-lang="es">ES</button></div>
  </div>
  <header class="header">
    <h1 id="home-title"><img class="logo" src="img/logo-unlikely-memories.svg" alt="Unlikely Memories" width="288" height="210"></h1>
    <p class="subtitle text-subtitle" id="home-subtitle"></p>
  </header>
  <div class="column"></div>
</main>

<!-- The page: markup only. Each piece's script (ui/*.js) is mounted on its element here, and fills in the texts.
     Three parts in a column, and the page scrolls (css/layout.css): the top (title bar and picture, with the strip hanging
     from it: ♫ ≡, directions, inventory; on phones ♫ ≡ sit beside the title bar and directions and inventory become
     panels opened from two tabs), the story, and the bottom (prompt, tabs). The top and the bottom stick. -->
<main class="layout text-ui" id="screen">
  <div class="top">
    <header class="titlebar"><h1 id="place">UNLIKELY MEMORIES</h1><p id="clock"><span id="l-day">Day</span> <span id="v-day">1</span> <span class="sep" aria-hidden="true">|</span> <time id="v-time" datetime="PT0H0M0S"><span id="v-hh">00</span><span class="colon">:</span><span id="v-mm">00</span><span class="colon">:</span><span id="v-ss">00</span></time></p></header>
    <div class="picture"><canvas width="320" height="136" role="img" aria-label=""></canvas></div>
    <!-- The buttons' icons are the SVG files in img/icons/ (Diego's, from Figma): replace a file to change its icon.
         Each shows at the file's own size, in its button's text colour (the .icon class, css/utilities.css). -->
    <!-- Directions and inventory: always shown in the strip on wide windows; on phones, panels (popovers) opened
         by the tabs below. -->
    <div class="strip">
      <div class="tools text-button">
        <button type="button" class="tool" id="music" aria-pressed="false" aria-label="Music" title="Music: off"><span class="icon" style="mask-image: url(img/icons/icon-music.svg)"></span></button>
        <button type="button" class="tool" id="options" popovertarget="options-panel" aria-label="Options" title="Options"><span class="icon" style="mask-image: url(img/icons/icon-menu.svg)"></span></button>
      </div>
      <section class="panel text-ui exits" id="exits-panel" popover aria-labelledby="tab-exits">
        <div class="compass text-button" role="group">
          <button type="button" class="corner" data-dir="in" tabindex="-1" aria-hidden="true"><span class="icon" style="mask-image: url(img/icons/icon-in.svg)"></span></button><button type="button" data-dir="n"><span class="icon" style="mask-image: url(img/icons/icon-north.svg)"></span></button><button type="button" class="corner" data-dir="u" tabindex="-1" aria-hidden="true"><span class="icon" style="mask-image: url(img/icons/icon-up.svg)"></span></button>
          <button type="button" data-dir="w"><span class="icon" style="mask-image: url(img/icons/icon-west.svg)"></span></button><button type="button" class="map open" popovertarget="map-panel" aria-haspopup="dialog"><span class="icon" style="mask-image: url(img/icons/icon-map.svg)"></span></button><button type="button" data-dir="e"><span class="icon" style="mask-image: url(img/icons/icon-east.svg)"></span></button>
          <button type="button" class="corner" data-dir="out" tabindex="-1" aria-hidden="true"><span class="icon" style="mask-image: url(img/icons/icon-out.svg)"></span></button><button type="button" data-dir="s"><span class="icon" style="mask-image: url(img/icons/icon-south.svg)"></span></button><button type="button" class="corner" data-dir="d" tabindex="-1" aria-hidden="true"><span class="icon" style="mask-image: url(img/icons/icon-down.svg)"></span></button>
        </div>
      </section>
      <section class="panel text-ui inventory" id="inventory-panel" popover aria-labelledby="tab-inventory">
        <ul class="slots">
          <li class="slot"></li><li class="slot"></li><li class="slot"></li>
          <li class="slot"></li><li class="slot"></li><li class="slot"></li>
          <li class="slot"></li><li class="slot"></li><li class="slot"></li>
        </ul>
      </section>
    </div>
  </div>
  <div class="log text-log" id="log" role="log" aria-label="Story"></div>
  <div class="bottom">
    <form class="prompt text-ui" id="prompt" autocomplete="off">
      <span class="mark" aria-hidden="true">&gt;</span><span class="line" aria-hidden="true"><span class="typed" id="typed"></span><span class="cursor"></span></span>
      <input id="cmd" type="text" name="command" enterkeyhint="send" autocapitalize="none" spellcheck="false" autocorrect="off" autocomplete="off" aria-label="Type a command">
      <span class="hint" id="prompt-hint" hidden></span>
    </form>
    <nav class="tabs text-button">
      <button type="button" class="tab" id="tab-exits" popovertarget="exits-panel" aria-expanded="false">DIRECTIONS</button>
      <button type="button" class="tab" id="tab-inventory" popovertarget="inventory-panel" aria-expanded="false">INVENTORY</button>
    </nav>
  </div>
</main>

<!-- Options: a popover (HTML popover API) opened by the ≡ button. Non-modal: it closes with Esc, by clicking
     outside, or with the button again; it sits in the browser's top layer, above everything else. -->
<div id="options-panel" class="options text-ui" popover role="dialog" aria-labelledby="options-title">
  <h2 id="options-title">OPTIONS</h2>
  <div class="actions">
    <button type="button" class="action" id="restart-game">Restart game</button>
    <button type="button" class="action" id="quit-game">Quit</button>
  </div>
</div>

<!-- The map: a popover (HTML popover API) opened by the M in the middle of the compass, or by the MAP command. Non-modal like
     the options: it closes with Esc, by clicking outside it, or with the × (ui/map.js). data-state says "open" or "closed",
     a hook for a later animation (ui/map.css). The rooms are drawn in .world and hidden from screen readers; the list
     beside them says the same in words. -->
<div id="map-panel" class="mapview text-ui" popover role="dialog" aria-labelledby="map-title" tabindex="-1" data-state="closed">
  <h2 id="map-title" class="visually-hidden">Map</h2>
  <button type="button" class="close text-label" aria-label="Close the map">×</button>
  <div class="area"><div class="world"></div></div>
  <h3 id="map-rooms" class="visually-hidden">Rooms on this level</h3>
  <ul class="places visually-hidden" aria-labelledby="map-rooms"></ul>
  <footer class="where"><p class="level text-level"></p><p class="hint text-hint"></p></footer>
</div>
</body>
</html>
