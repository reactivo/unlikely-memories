<!-- A world's own page (/<id>/: generated from this file by tools/pages.mjs, which marks the page <html data-world="<id>">): its cover and the
     keys. The third view of this page (css/layout.css shows one at a time; ui/splash.js fills it in); on the list's page and in the game it is
     never shown. The cover's picture is the canvas, drawn from the world's pictures.js `cover` (320 x 400), with the world's title drawn into
     its pixels by the engine (js/title.js); the canvas's label and the heading (visually hidden) carry the title for a screen reader. -->
<main class="splash text-ui" id="splash" aria-labelledby="splash-title">
  <div class="poster">
    <h1 class="name visually-hidden" id="splash-title"></h1>
    <p class="kicker visually-hidden"></p>
    <div class="cover"><canvas width="480" height="560" role="img" aria-label=""></canvas></div>
    <div class="keys"><span class="buttons"></span><button type="button" class="back"></button></div>
  </div>
</main>

<!-- The page: markup only. Each piece's script (ui/*.js) is mounted on its element here, and fills in the texts.
     Three parts in a column, and the page scrolls (css/layout.css): the top (title bar and picture, with the strip hanging
     from it: ≡, directions, inventory; on phones directions and inventory become panels opened from two tabs, and ≡ is a
     third tile in the tabs' row, the second ≡ button below), the story, and the bottom (prompt, tabs). The top and the bottom stick. -->
<main class="layout text-ui" id="screen">
  <div class="top">
    <header class="titlebar text-title"><h1 id="place">UNLIKELY MEMORIES</h1><p id="clock"><time id="v-time" datetime="PT0H0M0S"><span id="v-hh">00</span><span class="colon">:</span><span id="v-mm">00</span><span class="colon">:</span><span id="v-ss">00</span></time></p></header>
    <div class="picture"><canvas width="320" height="136" role="img" aria-label=""></canvas></div>
    <!-- The buttons' icons are drawn from img/icons/ (Diego's SVG files, from Figma) by ui/icons.js (generated from them: tools/icons.mjs),
         which js/main.js runs at start: each <span class="icon" data-icon="north"> (say) gets its inline <svg>, at the drawing's own size,
         in its button's text colour (the .icon class, css/utilities.css). -->
    <!-- Directions and inventory: always shown in the strip on wide windows; on phones, panels (popovers) opened
         by the tabs below. -->
    <div class="strip">
      <div class="tools text-button">
        <button type="button" class="tool key" id="options" data-hang="above" popovertarget="options-panel" aria-expanded="false">SETTINGS</button>
      </div>
      <section class="panel text-ui exits" id="exits-panel" popover aria-labelledby="tab-exits">
        <div class="compass text-button" role="group">
          <button type="button" class="key" data-dir="d"><span class="icon" data-icon="down"></span></button><button type="button" class="key" data-dir="n"><span class="icon" data-icon="north"></span></button><button type="button" class="key" data-dir="u"><span class="icon" data-icon="up"></span></button>
          <button type="button" class="key" data-dir="w"><span class="icon" data-icon="west"></span></button><button type="button" class="key" data-dir="s"><span class="icon" data-icon="south"></span></button><button type="button" class="key" data-dir="e"><span class="icon" data-icon="east"></span></button>
          <button type="button" class="map open key" popovertarget="map-panel" aria-haspopup="dialog"><span class="pin"><span class="icon" data-icon="map"></span></span><span class="label">See map</span></button>
        </div>
      </section>
      <section class="panel text-ui inventory" id="inventory-panel" popover aria-labelledby="tab-inventory">
        <ul class="slots">
          <li class="slot key-socket"></li><li class="slot key-socket"></li><li class="slot key-socket"></li>
          <li class="slot key-socket"></li><li class="slot key-socket"></li><li class="slot key-socket"></li>
          <li class="slot key-socket"></li><li class="slot key-socket"></li><li class="slot key-socket"></li>
        </ul>
      </section>
    </div>
  </div>
  <div class="log text-log" id="log" role="log" aria-label="Story"></div>
  <div class="bottom">
    <form class="prompt text-ui" id="prompt" autocomplete="off">
      <span class="mark" aria-hidden="true">&gt;</span><span class="line" aria-hidden="true"><span class="typed" id="typed"></span><span class="cursor"></span></span>
      <input id="cmd" type="text" name="command" enterkeyhint="send" autocapitalize="none" spellcheck="false" autocorrect="off" autocomplete="off" aria-label="Type a command">
      <span class="hint" id="prompt-hint" hidden></span>
    </form>
    <nav class="tabs text-button">
      <button type="button" class="tab key" id="tab-exits" popovertarget="exits-panel" aria-expanded="false">DIRECTIONS</button>
      <button type="button" class="tab key" id="tab-inventory" popovertarget="inventory-panel" aria-expanded="false">INVENTORY</button>
      <!-- The phones' ≡ (the strip's is #options in .tools, shown only in the strip layout; this one only where the tabs are):
           the same tool tile (ui/tools.css), opening the same panel above itself. -->
      <button type="button" class="tool key" id="options-tab" data-hang="above" popovertarget="options-panel" aria-expanded="false" aria-label="Settings" title="Settings"><span class="icon" data-icon="menu"></span></button>
    </nav>
  </div>
</main>

<!-- Options: a popover (HTML popover API) opened by the ≡ button. Non-modal: it closes with Esc, by clicking
     outside, or with the button again; it sits in the browser's top layer, above everything else. No title of its own: two
     blocks, SOUND (the three sliders: ui/soundpanel.js), GRAPHICS (the CRT effect and Reflections switches: ui/graphicspanel.js) and GAME (Restart game, Quit: ui/options.js). SOUND's heading line holds the on/off switch (ui/soundpanel.js). -->
<div id="options-panel" class="options text-ui" popover role="dialog" aria-label="Settings" tabindex="-1">
  <section class="sound" aria-labelledby="sound-title">
    <h2 id="sound-title">SOUND</h2>
    <div class="rows">
      <div class="row"><span id="label-sound">Sound on/off</span><button type="button" class="switch" id="sound-switch" role="switch" aria-checked="true" aria-labelledby="label-sound"><span class="knob"></span></button></div>
    </div>
    <div class="sliders">
      <label for="sound-music" id="label-music">Music</label><input type="range" id="sound-music" min="0" max="100">
      <label for="sound-tone" id="label-tone">Room</label><input type="range" id="sound-tone" min="0" max="100">
      <label for="sound-sounds" id="label-sounds">Sounds</label><input type="range" id="sound-sounds" min="0" max="100">
    </div>
  </section>
  <section class="graphics" aria-labelledby="graphics-title">
    <h2 id="graphics-title">GRAPHICS</h2>
    <div class="rows">
      <div class="row"><span id="label-crt">CRT effect</span><button type="button" class="switch" id="graphics-crt" role="switch" aria-checked="true" aria-labelledby="label-crt"><span class="knob"></span></button></div>
      <div class="row wide"><span id="label-reflections">Reflections</span><button type="button" class="switch" id="graphics-reflections" role="switch" aria-checked="true" aria-labelledby="label-reflections"><span class="knob"></span></button></div>
    </div>
  </section>
  <section class="game" aria-labelledby="game-title">
    <h2 id="game-title">GAME</h2>
    <div class="actions">
      <button type="button" class="action" id="restart-game">Restart game</button>
      <button type="button" class="action" id="quit-game">Quit</button>
    </div>
  </section>
</div>

<!-- The map: a popover (HTML popover API) opened by SEE MAP under the compass, or by the MAP command. Non-modal like
     the options: it closes with Esc, by clicking outside it, or with the × (ui/map.js). data-state says "open" or "closed",
     a hook for a later animation (ui/map.css). The rooms are drawn in .world and hidden from screen readers; the list
     beside them says the same in words. -->
<div id="map-panel" class="mapview text-ui" popover role="dialog" aria-labelledby="map-title" tabindex="-1" data-state="closed">
  <h2 id="map-title" class="visually-hidden">Map</h2>
